<section>
  <h2>Posts</h2>
  <ul class="posts">
    {%- for post in site.posts limit: 3 %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <time>{{ post.date | date: "%b %Y" }}</time>
      <p class="muted">{{ post.summary }}</p>
    </li>
    {%- endfor %}
  </ul>
  <p class="more"><a href="{{ '/posts/' | relative_url }}">all posts →</a></p>
</section>
